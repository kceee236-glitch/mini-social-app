<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Kcee Chatify">
    <meta name="description"
        content="Kcee Chatify is a live micro social chat platform by Kceetech. Join the conversation and post real-time updates instantly.">
    <meta name="google-site-verification" content="LGYFGRqI9BUI4nkQ4-aSp-BN14e7yTOkM7y1X7KGGZ8" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kceechatify.netlify.app/">
    <meta property="og:title" content="Kcee Chatify">
    <meta property="og:description" content="A real-time micro-social platform to broadcast public messages instantly.">
    <meta property="og:image" content="https://kceechatify.netlify.app/preview-image.jpg">

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://kceechatify.netlify.app/">
    <meta property="twitter:title" content="Kcee Chatify">
    <meta property="twitter:description"
        content="A real-time micro-social platform to broadcast public messages instantly.">
    <meta property="twitter:image" content="https://kceechatify.netlify.app/preview-image.jpg">

    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Kcee Chatify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Kcee Chatify</h1>

    <div class="compose-box">
        <input type="text" id="usernameInput" placeholder="Your Handle (e.g. @kcee_tech)">
        <textarea id="messageInput" rows="3" placeholder="What's happening? type a chat..."></textarea>
        <button onclick="sendPostToBackend()">Post Message</button>
    </div>

    <div class="feed-header">Chats</div>
    <div id="postsDisplayGrid"></div>
    <script src="script.js"></script>
</body>

</html>
